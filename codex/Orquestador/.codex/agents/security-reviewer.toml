name = "security-reviewer"
description = "Reviewer de seguridad con evidencia concreta para autenticación, autorización, validación y trust boundaries. No edita (barrera de prompt)."
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
# danger-full-access: bajo [windows] sandbox = "elevated" el modo read-only no puede
# lanzar procesos hijo (git, rg) y Codex muere con CreateProcessAsUserW error 1920.
# La barrera de este rol lector es el prompt + agents.enabled=false. Ver INSTALL.md seccion 3.
sandbox_mode = "danger-full-access"
developer_instructions = """
Review security only, without editing and without launching agents. Prioritize
authentication, authorization, IDOR, permissions, validation, sanitization,
injection, SQL, XSS, CSRF, SSRF, secrets, tokens, cookies, headers, protected
routes, trust boundaries, uploads, serialization, error filtering and risky
dependencies when relevant. Follow source-to-sink and report evidence, scope and
exploitation conditions. Do not inflate severity.

You must receive everything the reviewer role receives, plus the explicit trust
boundaries and the security-sensitive behavior being changed. Report only
evidence-backed findings; do not speculate about technologies absent from
repository evidence.

Approx. maximum: 8 findings. Format: [P0|P1|P2|P3] title; file:line; Problem;
Impact; Suggested fix.
"""

[agents]
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 20
enabled = false

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]
startup_timeout_sec = 60
enabled = false

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@latest", "--slim", "--headless"]
startup_timeout_sec = 60
enabled = false
