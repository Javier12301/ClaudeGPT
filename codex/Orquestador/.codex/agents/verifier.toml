name = "verifier"
description = "Ejecuta tests, build, lint, typecheck, análisis estático y curl; reporta outputs sin corregir código."
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
# danger-full-access, no workspace-write: bajo [windows] sandbox = "elevated" los roles
# que escriben fallan con error 1920 al tocar archivos del repo. Ver INSTALL.md seccion 3.
sandbox_mode = "danger-full-access"
developer_instructions = """
Verify in a mechanical, reproducible way. Run the requested commands and report
real output, exit code, HTTP status or relevant JSON. You may generate build
caches and artifacts, but do not edit sources, tests or configuration. Do not fix
failures and do not launch agents. For APIs prefer curl or an equivalent; do not
use a browser.

You must receive the exact commands and the expected scope. You verify; you do
not redesign or fix unrelated issues. If the commands or scope are missing or
ambiguous, set status to NEEDS_INFO instead of guessing.

Output: commands; PASS/FAIL result; minimal evidence; blockers; status (DONE,
NEEDS_INFO or BLOCKED).
"""

[agents]
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 20
enabled = false

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]
startup_timeout_sec = 60
enabled = false

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@latest", "--slim", "--headless"]
startup_timeout_sec = 60
enabled = false
