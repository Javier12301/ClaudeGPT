name = "verifier"
description = "Ejecuta tests, build, lint, typecheck, análisis estático y curl; reporta outputs sin corregir código."
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"
developer_instructions = """
Verificar de forma mecánica y reproducible. Ejecutar los comandos solicitados y reportar salida real, exit code, HTTP status o JSON relevante. Puede generar caches y artefactos del build, pero no editar fuentes, tests ni configuración. No corregir fallos y no lanzar agentes. Para APIs preferir curl o equivalente; no usar navegador.

Salida: comandos; resultado PASS/FAIL; evidencia mínima; bloqueos.
"""

[agents]
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 20
enabled = false

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]
startup_timeout_sec = 60
enabled = false

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@latest", "--slim", "--headless"]
startup_timeout_sec = 60
enabled = false
