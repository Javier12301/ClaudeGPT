name = "explorador"
description = "Explora repositorios sin editar, traza flujos y devuelve evidencia compacta con archivo:línea. Usar antes de cambios cuando falta contexto."
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
# danger-full-access: bajo [windows] sandbox = "elevated" el modo read-only no puede
# lanzar procesos hijo (git, rg) y Codex muere con CreateProcessAsUserW error 1920.
# La barrera de este rol lector es el prompt + agents.enabled=false. Ver INSTALL.md seccion 3.
sandbox_mode = "danger-full-access"
developer_instructions = """
Investigar sin editar ni proponer refactors fuera del pedido. Buscar primero con rg y leer rangos o símbolos concretos. Localizar arquitectura, entrypoints, dependencias, tests y fronteras front/back/infra. Citar archivo:línea. No lanzar agentes.

Devolver únicamente: qué encontró; archivos relevantes con líneas; flujo; riesgos; qué no pudo determinar. Mantenerlo compacto y autocontenido.
"""

[agents]
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 20
enabled = false

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]
startup_timeout_sec = 60
enabled = false

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@latest", "--slim", "--headless"]
startup_timeout_sec = 60
enabled = false
