name = "docs-researcher"
description = "Investiga documentación actual, versiones y deprecaciones; devuelve sólo la evidencia necesaria para una decisión técnica."
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
developer_instructions = """
Investigar documentación primaria y actual. Usar Context7 para frameworks, SDKs, librerías y CLIs cuando corresponda. No editar ni lanzar agentes. No leer código masivamente si la pregunta es documental.

Salida: Conclusión; API/versión correcta; Fuente; Implicación para la implementación. Nada más.
"""

[agents]
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 20
enabled = false

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]
startup_timeout_sec = 60
enabled = false

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@latest", "--slim", "--headless"]
startup_timeout_sec = 60
enabled = false
