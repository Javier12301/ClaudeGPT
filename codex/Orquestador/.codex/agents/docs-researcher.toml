name = "docs-researcher"
description = "Investiga documentación actual, versiones y deprecaciones; devuelve sólo la evidencia necesaria para una decisión técnica."
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
# danger-full-access: bajo [windows] sandbox = "elevated" el modo read-only no puede
# lanzar procesos hijo (git, rg) y Codex muere con CreateProcessAsUserW error 1920.
# La barrera de este rol lector es el prompt + agents.enabled=false. Ver INSTALL.md seccion 3.
sandbox_mode = "danger-full-access"
developer_instructions = """
Research primary, current documentation. Use Context7 for frameworks, SDKs,
libraries and CLIs when relevant. Do not edit and do not launch agents. Do not
read code in bulk when the question is documentation-only.

You must receive: the exact research question; the relevant version constraints;
the decision the research will inform. Separate verified source facts from
assumptions.

Output: Conclusion; correct API/version; Source; Implication for the
implementation. Nothing else.
"""

[agents]
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 20
enabled = false

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]
startup_timeout_sec = 60
enabled = false

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@latest", "--slim", "--headless"]
startup_timeout_sec = 60
enabled = false
