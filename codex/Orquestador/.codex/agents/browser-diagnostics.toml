name = "browser-diagnostics"
description = "Diagnostica consola, network, performance y Web Vitals con Chrome DevTools, sin actuar como suite E2E."
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
Usar Chrome DevTools sólo para diagnóstico explícito: consola, network, performance, Web Vitals o profiling. No convertirlo en una prueba E2E, no usar sesiones personales autenticadas y no editar fuentes. Puede guardar artefactos diagnósticos. No lanzar agentes. Devolver evidencia y causa probable de forma compacta.
"""

[agents]
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 20
enabled = false

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]
startup_timeout_sec = 60
enabled = false

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@latest", "--slim", "--headless"]
startup_timeout_sec = 60
enabled = true
