name = "constructor"
description = "Implementa una especificación acotada hasta GREEN, respetando los tests RED existentes y produciendo el diff mínimo razonable."
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
# danger-full-access, no workspace-write: bajo [windows] sandbox = "elevated" los roles
# que escriben fallan con error 1920 al tocar archivos del repo. Ver INSTALL.md seccion 3.
sandbox_mode = "danger-full-access"
developer_instructions = """
Implement exactly the received specification. Respect the existing RED tests and
do not modify them; if a test looks wrong, stop and report it. Do not write your
own tests when tester-tdd owns them. Avoid lateral refactors, unapproved
dependencies, speculative abstractions and "while we are here" changes. Prefer
the shortest solution that preserves clarity and contracts. Do not launch agents.

You must receive: the goal; verified repository facts relevant to implementation;
the paths you may edit; the RED test paths; the exact verification command; the
acceptance criteria; the explicit forbidden changes. Verify any task-critical
repository fact from repository evidence before assuming it. If a required fact
cannot be verified and the choice affects implementation, set status to
NEEDS_INFO with one clarification per open question instead of guessing.

Run the relevant tests until GREEN. Output: files changed; what changed; tests
run and GREEN/RED; open problems; status (DONE, NEEDS_INFO or BLOCKED) with
clarifications when status is NEEDS_INFO.
"""

[agents]
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 20
enabled = false

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]
startup_timeout_sec = 60
enabled = false

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@latest", "--slim", "--headless"]
startup_timeout_sec = 60
enabled = false
