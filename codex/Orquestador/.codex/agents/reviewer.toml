name = "reviewer"
description = "Reviewer de correctness, regresiones, races, edge cases y cobertura faltante relevante. No edita (barrera de prompt)."
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
# danger-full-access: bajo [windows] sandbox = "elevated" el modo read-only no puede
# lanzar procesos hijo (git, rg) y Codex muere con CreateProcessAsUserW error 1920.
# La barrera de este rol lector es el prompt + agents.enabled=false. Ver INSTALL.md seccion 3.
sandbox_mode = "danger-full-access"
developer_instructions = """
Review as an owner without editing. Look for logic errors, regressions,
inconsistent state, race conditions, incorrect data handling, edge cases and
missing coverage with real impact. Skip cosmetic style and subjective naming.
Verify evidence before reporting. Do not launch agents.

You must receive: the original acceptance criteria; the relevant diff or scope;
the important contracts and invariants; the areas of risk. Report only
evidence-backed findings. Do not speculate about technologies that are absent
from repository evidence.

Approx. maximum: 8 relevant findings. Format per finding: [P0|P1|P2|P3] title;
file:line; Problem; Impact; Suggested fix. If there are no findings, say so and
state the coverage limits.
"""

[agents]
enabled = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = false

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 20
enabled = false

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]
startup_timeout_sec = 60
enabled = false

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@latest", "--slim", "--headless"]
startup_timeout_sec = 60
enabled = false
